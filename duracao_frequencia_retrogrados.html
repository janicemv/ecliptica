<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duração e Frequência dos Retrógrados</title>
<style>
  :root {
    --text-primary: #1a1a2e;
    --text-secondary: #66667a;
    --text-muted: #9999ac;
    --text-accent: #0f8a68;
    --surface-1: #eef0f4;
    --border: #e2e4ea;
    --border-accent: #1D9E75;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text-primary);
    background: #fff;
    padding: 32px 28px;
    max-width: 720px;
    margin: 0 auto;
  }
</style>
</head>
<body>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Comparação da duração típica do movimento retrógrado de cada planeta visível e do intervalo entre episódios.</h2>
<div style="padding:0.5rem 0;">
  <p style="font-size:13px;color:var(--text-secondary);margin:0 0 12px;">Duração típica de cada retrógrado (barra) e intervalo entre episódios</p>
  <div id="rows" style="display:flex;flex-direction:column;gap:12px;"></div>
  <div style="display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--text-secondary);align-items:center;">
    <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:8px;background:#5DCAA5;border-radius:2px;display:inline-block;"></span>dias em retrógrado</span>
  </div>
</div>
<script>
const dados = [
  {n:'Mercúrio', dur:22, faixa:'19–24 dias', freq:'a cada ~4 meses (3×/ano)'},
  {n:'Vênus', dur:42, faixa:'40–43 dias', freq:'a cada ~19 meses'},
  {n:'Marte', dur:70, faixa:'58–81 dias', freq:'a cada ~26 meses'},
  {n:'Júpiter', dur:120, faixa:'~120 dias', freq:'a cada ~13 meses'},
  {n:'Saturno', dur:138, faixa:'~135–140 dias', freq:'a cada ~12,5 meses'}
];
const max = 150;
const wrap = document.getElementById('rows');
dados.forEach(d=>{
  const row = document.createElement('div');
  row.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">' +
      '<span style="font-size:14px;font-weight:500;">' + d.n + '</span>' +
      '<span style="font-size:12px;color:var(--text-secondary);">' + d.freq + '</span>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
      '<div style="flex:1;height:10px;background:var(--surface-1);border-radius:5px;overflow:hidden;">' +
        '<div style="width:' + Math.round(d.dur/max*100) + '%;height:100%;background:#5DCAA5;border-radius:5px;"></div>' +
      '</div>' +
      '<span style="font-size:12px;color:var(--text-secondary);min-width:92px;text-align:right;">' + d.faixa + '</span>' +
    '</div>';
  wrap.appendChild(row);
});
</script>
</body>
</html>
